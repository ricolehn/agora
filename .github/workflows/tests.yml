name: Tests

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR / branch cancels the run that is still going
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      # Same PocketBase version as the Docker image (single source: ARG POCKETBASE_VERSION in the Dockerfile)
      - name: Download PocketBase
        run: |
          version="$(sed -n 's/^ARG POCKETBASE_VERSION=//p' Dockerfile)"
          test -n "$version"
          curl -fsSL "https://github.com/pocketbase/pocketbase/releases/download/v${version}/pocketbase_${version}_linux_amd64.zip" -o "$RUNNER_TEMP/pocketbase.zip"
          unzip -q "$RUNNER_TEMP/pocketbase.zip" pocketbase -d "$RUNNER_TEMP/pocketbase"
          echo "POCKETBASE_BIN=$RUNNER_TEMP/pocketbase/pocketbase" >> "$GITHUB_ENV"

      - name: Run tests
        working-directory: backend
        env:
          REQUIRE_POCKETBASE: '1'
        run: npm test

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  # Known vulnerabilities in the runtime dependencies. Informational: a new advisory for some package must not
  # turn an unrelated pull request red, so findings become a warning and a summary instead of a failure.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: npm audit (production dependencies)
        working-directory: backend
        run: |
          if npm audit --omit=dev --audit-level=high > audit.txt 2>&1; then
            echo "No known high or critical vulnerabilities." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=npm audit::Known high or critical vulnerabilities in backend dependencies - see the job summary"
            { echo '### npm audit'; echo '```'; cat audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
