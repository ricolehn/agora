name: Tests

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR / branch cancels the run that is still going
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test suite (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      # Same PocketBase version as the Docker image (single source: ARG POCKETBASE_VERSION in the Dockerfile)
      - name: Download PocketBase
        run: |
          version="$(sed -n 's/^ARG POCKETBASE_VERSION=//p' Dockerfile)"
          test -n "$version"
          curl -fsSL "https://github.com/pocketbase/pocketbase/releases/download/v${version}/pocketbase_${version}_linux_amd64.zip" -o "$RUNNER_TEMP/pocketbase.zip"
          unzip -q "$RUNNER_TEMP/pocketbase.zip" pocketbase -d "$RUNNER_TEMP/pocketbase"
          echo "POCKETBASE_BIN=$RUNNER_TEMP/pocketbase/pocketbase" >> "$GITHUB_ENV"

      - name: Run tests
        working-directory: backend
        env:
          REQUIRE_POCKETBASE: '1'
        run: npm test

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
